<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor MM Shippify Team</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    :root {
      --preto: #151515;
      --chumbo: #3A3931;
      --cinza: #DAD7D1;
      --vermelho: #EF404C;
      --amarelo: #FEDD29;
      --branco: #FFFFFF;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--cinza);
      color: var(--preto);
    }

    .topbar {
      background: var(--preto);
      color: var(--branco);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 19px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      height: 26px;
      width: auto;
      display: block;
    }

    .topbar .right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
      color: var(--cinza);
    }

    .topbar button {
      background: var(--chumbo);
      color: var(--branco);
      border: 1px solid var(--chumbo);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .topbar button:hover {
      background: #4a4940;
    }

    .topbar button.active-toggle {
      background: var(--amarelo);
      color: var(--preto);
      border-color: var(--amarelo);
      font-weight: bold;
    }

    #refreshBtn {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #refreshBtn .icon {
      display: inline-block;
      transition: transform .4s ease;
    }

    #refreshBtn.spinning .icon {
      transform: rotate(360deg);
    }

    #lastRefreshed {
      font-size: 11px;
      color: #9a978f;
      white-space: nowrap;
    }

    /* ---------- login ---------- */
    #loginWrap {
      min-height: calc(100vh - 55px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #loginForm {
      background: var(--branco);
      border: 1px solid var(--cinza);
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 360px;
    }

    #loginForm h2 {
      margin: 0 0 18px;
      font-size: 18px;
      color: var(--preto);
    }

    #loginForm label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--chumbo);
    }

    #loginForm input {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--cinza);
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
    }

    #loginForm input:focus {
      outline: none;
      border-color: var(--chumbo);
    }

    #loginForm button {
      width: 100%;
      background: var(--preto);
      color: var(--branco);
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    #loginError {
      color: var(--vermelho);
      font-size: 13px;
      margin-top: 10px;
      min-height: 16px;
    }

    /* ---------- dashboard ---------- */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: calc(100vh - 55px);
    }

    .panel {
      background: var(--branco);
      border-right: 1px solid var(--cinza);
      overflow: auto;
      padding: 14px;
    }

    .panel .summary {
      font-size: 13px;
      color: var(--chumbo);
      margin-bottom: 12px;
    }

    .driver-card {
      border: 1px solid var(--cinza);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .15s;
    }

    .driver-card:hover {
      border-color: var(--chumbo);
    }

    .driver-card.selected {
      border-color: var(--preto);
      box-shadow: 0 0 0 1px var(--preto);
    }

    .driver-card .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      color: var(--preto);
    }

    .driver-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cinza);
      flex-shrink: 0;
    }

    .driver-dot.online {
      background: var(--amarelo);
      box-shadow: 0 0 6px rgba(254,221,41,.8);
    }

    .driver-dot.stale {
      background: var(--chumbo);
    }

    .driver-dot.offline {
      background: var(--cinza);
    }

    .driver-dot.denied {
      background: var(--vermelho);
    }

    .driver-meta {
      font-size: 12px;
      color: var(--chumbo);
      line-height: 1.6;
    }

    .driver-meta .label {
      color: #9a978f;
    }

    .driver-meta .address-line {
      display: block;
      margin-top: 2px;
      color: var(--preto);
    }

    .driver-meta .coords-line {
      font-family: "Courier New", monospace;
      font-size: 11px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--cinza);
      color: var(--preto);
    }

    .stop-btn {
      width: 100%;
      margin-top: 10px;
      background: var(--vermelho);
      color: var(--branco);
      border: 0;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .stop-btn:hover {
      background: #d63541;
    }

    .stop-btn.remove-btn {
      background: var(--chumbo);
    }

    .stop-btn.remove-btn:hover {
      background: #4a4940;
    }

    .stop-btn:disabled {
      background: var(--cinza);
      color: var(--chumbo);
      cursor: not-allowed;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .empty-state {
      text-align: center;
      color: var(--chumbo);
      font-size: 13px;
      padding: 40px 10px;
    }

    .popup-stop-btn {
      margin-top: 8px;
      width: 100%;
      background: #EF404C;
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .popup-stop-btn.remove-btn {
      background: #3A3931;
    }

    .popup-address {
      display: block;
      margin: 4px 0;
      font-size: 12px;
    }

    .popup-coords {
      display: block;
      font-family: "Courier New", monospace;
      font-size: 11px;
      color: #3A3931;
    }

    @media (max-width: 760px) {
      .layout {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 55px);
      }
      .panel {
        border-right: 0;
        border-bottom: 1px solid var(--cinza);
        max-height: 40vh;
      }
      #map {
        min-height: 60vh;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>
      <img class="brand-logo" src="favicon.png" alt="MM Shippify">
      Painel Monitor Middle Mile Team. 
    </h1>
    <div class="right" id="topRight">
      <span id="lastRefreshed"></span>
      <button id="refreshBtn" type="button" title="Atualizar status dos motoristas">
        <span class="icon">⟳</span> Atualizar
      </button>
      <button id="darkMapToggle" type="button"> Mapa escuro</button>
      <span id="userEmail"></span>
    </div>
  </header>

  <!-- ---------- LOGIN ---------- -->
  <div id="loginWrap">
    <form id="loginForm">
      <h2>Acesso do monitor</h2>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">ENTRAR</button>
      <div id="loginError"></div>
    </form>
  </div>

  <!-- ---------- DASHBOARD ---------- -->
  <main class="layout" id="dashboard" style="display:none;">
    <aside class="panel">
      <div class="summary" id="summary">Carregando motoristas...</div>
      <div id="driverList"></div>
    </aside>
    <section id="map"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const loginWrap = document.getElementById("loginWrap");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const userEmail = document.getElementById("userEmail");
    const summary = document.getElementById("summary");
    const driverList = document.getElementById("driverList");
    const darkMapToggle = document.getElementById("darkMapToggle");
    const refreshBtn = document.getElementById("refreshBtn");
    const lastRefreshed = document.getElementById("lastRefreshed");

    let map = null;
    let tileLayer = null;
    let isDarkMap = false;
    const markers = {};   // uid -> L.marker
    const drivers = {};   // uid -> driver data
    let selectedUid = null;

    // uid -> { lat, lng, time, address, addressDetails } — cache do endereço
    // já resolvido, para não bater na API de geocodificação a cada render.
    const geocodeCache = {};
    // uid -> "carregando" | "erro" — para mostrar feedback enquanto busca.
    const geocodeState = {};

    const LIGHT_TILES = {
      url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      attribution: "&copy; OpenStreetMap contributors"
    };
    const DARK_TILES = {
      url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
      attribution: "&copy; OpenStreetMap contributors &copy; CARTO"
    };

    // ---------- login ----------
    loginForm.addEventListener("submit", e => {
      e.preventDefault();
      loginError.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password).catch(err => {
        loginError.textContent = "Não foi possível entrar. Verifique e-mail e senha.";
        console.error(err);
      });
    });

    auth.onAuthStateChanged(user => {
      if (user && !user.isAnonymous) {
        loginWrap.style.display = "none";
        dashboard.style.display = "grid";
        userEmail.textContent = user.email;
        const logoutBtn = document.createElement("button");
        logoutBtn.textContent = "Sair";
        logoutBtn.onclick = () => auth.signOut();
        document.getElementById("topRight").appendChild(logoutBtn);
        initMap();
        listenDrivers();
      } else {
        loginWrap.style.display = "flex";
        dashboard.style.display = "none";
      }
    });

    // ---------- mapa ----------
    function initMap() {
      if (map) return;
      map = L.map("map").setView([-14.2350, -51.9253], 4);
      applyTileLayer(LIGHT_TILES);
    }

    function applyTileLayer(tiles) {
      if (tileLayer) map.removeLayer(tileLayer);
      tileLayer = L.tileLayer(tiles.url, {
        maxZoom: 19,
        attribution: tiles.attribution
      }).addTo(map);
    }

    darkMapToggle.addEventListener("click", () => {
      isDarkMap = !isDarkMap;
      applyTileLayer(isDarkMap ? DARK_TILES : LIGHT_TILES);
      darkMapToggle.textContent = isDarkMap ? "Mapa claro" : "Mapa escuro";
      darkMapToggle.classList.toggle("active-toggle", isDarkMap);
    });

    // ---------- atualização manual ----------
    // Os dados já chegam em tempo real via db.ref("drivers").on("value"),
    // mas o status "online / desatualizado / offline" de cada motorista é
    // calculado a partir de Date.now() no momento da renderização — ou
    // seja, ele só muda quando a lista é redesenhada. Esse botão força um
    // novo cálculo/desenho da lista (e do horário mostrado), sem precisar
    // esperar a próxima atualização de localização de algum motorista.
    function refreshNow() {
      refreshBtn.classList.add("spinning");
      renderList();
      updateLastRefreshedLabel();
      setTimeout(() => refreshBtn.classList.remove("spinning"), 400);
    }

    function updateLastRefreshedLabel() {
      lastRefreshed.textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR");
    }

    refreshBtn.addEventListener("click", refreshNow);

    // Também recalcula sozinho a cada 30s, para os pontos (online/stale/
    // offline) não ficarem desatualizados enquanto ninguém clica no botão.
    setInterval(() => {
      renderList();
      updateLastRefreshedLabel();
    }, 30 * 1000);

    // ---------- dados em tempo real ----------
    function listenDrivers() {
      db.ref("drivers").on("value", snapshot => {
        const data = snapshot.val() || {};
        Object.keys(drivers).forEach(uid => { if (!data[uid]) removeDriver(uid); });
        Object.keys(data).forEach(uid => upsertDriver(uid, data[uid]));
        renderList();
        updateLastRefreshedLabel();
      });
    }

    function removeDriver(uid) {
      delete drivers[uid];
      delete geocodeCache[uid];
      delete geocodeState[uid];
      if (markers[uid]) {
        map.removeLayer(markers[uid]);
        delete markers[uid];
      }
    }

    function upsertDriver(uid, info) {
      drivers[uid] = info;

      if (info.lat != null && info.lng != null) {
        if (!markers[uid]) {
          markers[uid] = L.marker([info.lat, info.lng]).addTo(map);
          markers[uid].on("click", () => selectDriver(uid));
        } else {
          markers[uid].setLatLng([info.lat, info.lng]);
        }
        markers[uid].bindPopup(popupHtml(uid, info));
        maybeReverseGeocode(uid, info.lat, info.lng);
      }
    }

    // ---------- geocodificação reversa (lat/lng -> endereço) ----------
    // Usa a API pública do Nominatim (OpenStreetMap). A política de uso
    // deles pede no máximo ~1 requisição por segundo, então usamos uma
    // fila simples que processa um motorista por vez, com um pequeno
    // intervalo entre chamadas. Também só busca de novo se o motorista se
    // moveu mais de ~30m ou se o endereço em cache tiver mais de 10min.
    const geocodeQueue = [];
    let geocodeQueueRunning = false;

    function maybeReverseGeocode(uid, lat, lng) {
      const cached = geocodeCache[uid];
      if (cached) {
        const moved = distanceMeters(cached.lat, cached.lng, lat, lng);
        const age = Date.now() - cached.time;
        if (moved < 30 && age < 10 * 60 * 1000) return; // ainda válido, não busca de novo
      }
      if (geocodeState[uid] === "carregando") return; // já na fila/pendente

      geocodeState[uid] = "carregando";
      geocodeQueue.push({ uid, lat, lng });
      processGeocodeQueue();
    }

    function processGeocodeQueue() {
      if (geocodeQueueRunning) return;
      geocodeQueueRunning = true;

      const step = () => {
        const item = geocodeQueue.shift();
        if (!item) {
          geocodeQueueRunning = false;
          return;
        }
        doReverseGeocode(item.uid, item.lat, item.lng).finally(() => {
          setTimeout(step, 1100); // respeita o limite de ~1 req/s do Nominatim
        });
      };
      step();
    }

    function doReverseGeocode(uid, lat, lng) {
      const url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="
        + encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lng)
        + "&zoom=18&addressdetails=1";

      return fetch(url, { headers: { "Accept": "application/json" } })
        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(data => {
          geocodeCache[uid] = {
            lat: lat,
            lng: lng,
            time: Date.now(),
            address: data.display_name || null,
            addressDetails: data.address || {}
          };
          geocodeState[uid] = "ok";
          renderList();
          if (markers[uid] && drivers[uid]) {
            markers[uid].setPopupContent(popupHtml(uid, drivers[uid]));
          }
        })
        .catch(err => {
          geocodeState[uid] = "erro";
          console.warn("Falha ao obter endereço para " + uid, err);
        });
    }

    // Distância aproximada em metros entre duas coordenadas (Haversine).
    function distanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function formatCoords(lat, lng) {
      if (lat == null || lng == null) return "—";
      return lat.toFixed(5) + ", " + lng.toFixed(5);
    }

    function addressLine(uid) {
      const cached = geocodeCache[uid];
      if (cached && cached.address) return escapeHtml(cached.address);
      if (geocodeState[uid] === "carregando") return "Buscando endereço...";
      if (geocodeState[uid] === "erro") return "Endereço indisponível";
      return "—";
    }

    function popupHtml(uid, info) {
      const canStop = info.status !== "encerrado";
      const actionHtml = canStop
        ? '<button class="popup-stop-btn" onclick="window.stopDriver(\'' + uid + '\')"> Encerrar rastreamento</button>'
        : '<button class="popup-stop-btn remove-btn" onclick="window.removeDriverCard(\'' + uid + '\')">✖ Remover da lista</button>';

      return "<strong>" + escapeHtml(info.nome || "Motorista") + "</strong><br>" +
        (info.placa ? escapeHtml(info.placa) + "<br>" : "") +
        "Sinal: " + signalStatus(info).label + "<br>" +
        "Status GPS: " + statusLabel(info.status) + "<br>" +
        "Atualizado: " + formatTime(info.ultimaAtualizacao) + "<br>" +
        '<span class="popup-address">📍 ' + addressLine(uid) + '</span>' +
        '<span class="popup-coords">' + formatCoords(info.lat, info.lng) + '</span>' +
        actionHtml;
    }

    // ---------- lista lateral ----------
    function renderList() {
      const uids = Object.keys(drivers);
      summary.textContent = uids.length
        ? uids.length + " motorista(s) registrados"
        : "Nenhum motorista registrado ainda.";

      if (uids.length === 0) {
        driverList.innerHTML = '<div class="empty-state">Assim que um motorista aceitar o rastreamento, ele aparecerá aqui.</div>';
        return;
      }

      // mais recentes primeiro
      uids.sort((a, b) => (drivers[b].ultimaAtualizacao || 0) - (drivers[a].ultimaAtualizacao || 0));

      driverList.innerHTML = "";
      uids.forEach(uid => {
        const info = drivers[uid];
        const canStop = info.status !== "encerrado";
        const hasCoords = info.lat != null && info.lng != null;
        const card = document.createElement("div");
        card.className = "driver-card" + (uid === selectedUid ? " selected" : "");
        card.innerHTML =
          '<div class="name-row"><span class="driver-dot ' + dotClass(info) + '"></span>' +
          escapeHtml(info.nome || "Motorista") + '</div>' +
          '<div class="driver-meta">' +
          (info.telefone ? '<span class="label">Tel:</span> ' + escapeHtml(info.telefone) + '<br>' : '') +
          (info.placa ? '<span class="label">Veículo:</span> ' + escapeHtml(info.placa) + '<br>' : '') +
          (info.destino ? '<span class="label">Rota:</span> ' + escapeHtml(info.destino) + '<br>' : '') +
          '<span class="label">Sinal:</span> <span class="badge">' + signalStatus(info).label + '</span><br>' +
          '<span class="label">Status GPS:</span> ' + statusLabel(info.status) + '<br>' +
          '<span class="label">Autorizado em:</span> ' + formatTime(info.autorizadoEm) + '<br>' +
          '<span class="label">Última atualização:</span> ' + formatTime(info.ultimaAtualizacao) +
          (hasCoords
            ? '<span class="address-line">📍 <span class="label">Endereço:</span> ' + addressLine(uid) + '</span>' +
              '<span class="coords-line"><span class="label">Coordenadas:</span> ' + formatCoords(info.lat, info.lng) + '</span>'
            : '<span class="address-line"><span class="label">Localização:</span> ainda não recebida</span>') +
          '</div>';

        // Botão de ação: enquanto ativo, encerra o rastreamento.
        // Depois de encerrado, vira "Remover da lista" e apaga o registro
        // do banco para não poluir o painel.
        const actionBtn = document.createElement("button");
        actionBtn.type = "button";
        actionBtn.className = "stop-btn" + (canStop ? "" : " remove-btn");
        actionBtn.textContent = canStop ? "Encerrar rastreamento" : "✖ Remover da lista";
        actionBtn.addEventListener("click", ev => {
          ev.stopPropagation();
          if (canStop) {
            stopDriver(uid);
          } else {
            removeDriverCard(uid);
          }
        });
        card.appendChild(actionBtn);

        card.addEventListener("click", () => selectDriver(uid));
        driverList.appendChild(card);
      });
    }

    function selectDriver(uid) {
      selectedUid = uid;
      renderList();
      const info = drivers[uid];
      if (info && info.lat != null && info.lng != null) {
        map.setView([info.lat, info.lng], 16);
        if (markers[uid]) markers[uid].openPopup();
      }
    }

    // ---------- encerrar rastreamento (feito pelo monitor) ----------
    function stopDriver(uid) {
      const info = drivers[uid];
      const nome = info ? (info.nome || "este motorista") : "este motorista";
      if (!confirm('Encerrar o rastreamento de "' + nome + '"? O motorista precisará reiniciar o processo para voltar a compartilhar a localização.')) {
        return;
      }
      db.ref("drivers/" + uid).update({
        status: "encerrado",
        encerradoPeloMonitorEm: firebase.database.ServerValue.TIMESTAMP,
        ultimaAtualizacao: firebase.database.ServerValue.TIMESTAMP
      });
    }
    window.stopDriver = stopDriver;

    // ---------- remover card encerrado (limpeza do painel) ----------
    function removeDriverCard(uid) {
      const info = drivers[uid];
      const nome = info ? (info.nome || "este motorista") : "este motorista";
      if (!confirm('Remover "' + nome + '" da lista? Isso apaga o registro definitivamente do banco de dados.')) {
        return;
      }
      db.ref("drivers/" + uid).remove();
    }
    window.removeDriverCard = removeDriverCard;

    // ---------- helpers ----------
    // "Sinal" é calculado a partir de dois campos que o app do motorista
    // agora envia em tempo real:
    // - conexao: "conectado" / "desconectado" — vem da presença de conexão
    //   do Firebase (onDisconnect), definida pelo SERVIDOR assim que ele
    //   percebe que o celular do motorista caiu (tela bloqueada tempo
    //   suficiente, sem internet, app fechado). É o dado mais confiável
    //   que existe aqui — não depende do celular do motorista conseguir
    //   avisar nada.
    // - telaAberta: true/false — a página do motorista está com o app
    //   em primeiro plano (visível) agora.
    // Motoristas que ainda estão numa versão antiga do link (sem esses
    // dois campos) caem no cálculo antigo por tempo, como reserva.
    function signalStatus(info) {
      if (info.status === "encerrado") {
        return { dot: "offline", label: "Encerrado" };
      }
      if (info.status === "permissao_negada") {
        return { dot: "denied", label: "Permissão de localização negada" };
      }

      if (info.conexao === "desconectado") {
        return { dot: "offline", label: "🔴 Sem sinal" };
      }
      if (info.conexao === "conectado") {
        if (info.telaAberta === true) {
          return { dot: "online", label: "🟢 Com sinal" };
        }
        if (info.telaAberta === false) {
          return { dot: "stale", label: "🟡 Tela bloqueada / em segundo plano" };
        }
      }

      // fallback por tempo, só para registros sem os campos novos
      const age = Date.now() - (info.ultimaAtualizacao || 0);
      if (age < 2 * 60 * 1000) return { dot: "online", label: "🟢 Com sinal (estimado)" };
      if (age < 10 * 60 * 1000) return { dot: "stale", label: "🟡 Tela bloqueada (estimado)" };
      return { dot: "offline", label: "🔴 Sem sinal (estimado)" };
    }

    function dotClass(info) {
      return signalStatus(info).dot;
    }

    function statusLabel(status) {
      const map = {
        ativo: "Ativo",
        aguardando_gps: "Aguardando GPS",
        permissao_negada: "Permissão negada",
        indisponivel: "GPS indisponível",
        timeout: "Tempo esgotado",
        encerrado: "Encerrado"
      };
      return map[status] || status || "—";
    }

    function formatTime(ts) {
      if (!ts) return "—";
      return new Date(ts).toLocaleString("pt-BR");
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[ch]));
    }
  </script>
</body>
