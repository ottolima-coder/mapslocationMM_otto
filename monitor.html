<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Monitor — MM Shippify</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    .topbar {
      background: #111827;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 19px;
    }

    .topbar .right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }

    .topbar button {
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ---------- login ---------- */
    #loginWrap {
      min-height: calc(100vh - 55px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #loginForm {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 360px;
    }

    #loginForm h2 {
      margin: 0 0 18px;
      font-size: 18px;
    }

    #loginForm label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    #loginForm input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccd1d8;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 14px;
    }

    #loginForm button {
      width: 100%;
      background: #111827;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    #loginError {
      color: #dc2626;
      font-size: 13px;
      margin-top: 10px;
      min-height: 16px;
    }

    /* ---------- dashboard ---------- */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: calc(100vh - 55px);
    }

    .panel {
      background: white;
      border-right: 1px solid #ddd;
      overflow: auto;
      padding: 14px;
    }

    .panel .summary {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .driver-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color .15s;
    }

    .driver-card:hover {
      border-color: #9ca3af;
    }

    .driver-card.selected {
      border-color: #111827;
      box-shadow: 0 0 0 1px #111827;
    }

    .driver-card .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .driver-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }

    .driver-dot.online {
      background: #22c55e;
      box-shadow: 0 0 6px rgba(34,197,94,.7);
    }

    .driver-dot.stale {
      background: #f59e0b;
    }

    .driver-dot.offline {
      background: #9ca3af;
    }

    .driver-dot.denied {
      background: #dc2626;
    }

    .driver-meta {
      font-size: 12px;
      color: #4b5563;
      line-height: 1.6;
    }

    .driver-meta .label {
      color: #9ca3af;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 7px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #374151;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .empty-state {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      padding: 40px 10px;
    }

    @media (max-width: 760px) {
      .layout {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 55px);
      }
      .panel {
        border-right: 0;
        border-bottom: 1px solid #ddd;
        max-height: 40vh;
      }
      #map {
        min-height: 60vh;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <h1>🖥️ MM Shippify — Painel do Monitor</h1>
    <div class="right" id="topRight">
      <span id="userEmail"></span>
    </div>
  </header>

  <!-- ---------- LOGIN ---------- -->
  <div id="loginWrap">
    <form id="loginForm">
      <h2>Acesso do monitor</h2>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">ENTRAR</button>
      <div id="loginError"></div>
    </form>
  </div>

  <!-- ---------- DASHBOARD ---------- -->
  <main class="layout" id="dashboard" style="display:none;">
    <aside class="panel">
      <div class="summary" id="summary">Carregando motoristas...</div>
      <div id="driverList"></div>
    </aside>
    <section id="map"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const loginWrap = document.getElementById("loginWrap");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const userEmail = document.getElementById("userEmail");
    const summary = document.getElementById("summary");
    const driverList = document.getElementById("driverList");

    let map = null;
    const markers = {};   // uid -> L.marker
    const drivers = {};   // uid -> driver data
    let selectedUid = null;

    // ---------- login ----------
    loginForm.addEventListener("submit", e => {
      e.preventDefault();
      loginError.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password).catch(err => {
        loginError.textContent = "Não foi possível entrar. Verifique e-mail e senha.";
        console.error(err);
      });
    });

    auth.onAuthStateChanged(user => {
      if (user && !user.isAnonymous) {
        loginWrap.style.display = "none";
        dashboard.style.display = "grid";
        userEmail.textContent = user.email;
        const logoutBtn = document.createElement("button");
        logoutBtn.textContent = "Sair";
        logoutBtn.onclick = () => auth.signOut();
        document.getElementById("topRight").appendChild(logoutBtn);
        initMap();
        listenDrivers();
      } else {
        loginWrap.style.display = "flex";
        dashboard.style.display = "none";
      }
    });

    // ---------- mapa ----------
    function initMap() {
      if (map) return;
      map = L.map("map").setView([-14.2350, -51.9253], 4);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);
    }

    // ---------- dados em tempo real ----------
    function listenDrivers() {
      db.ref("drivers").on("value", snapshot => {
        const data = snapshot.val() || {};
        Object.keys(drivers).forEach(uid => { if (!data[uid]) removeDriver(uid); });
        Object.keys(data).forEach(uid => upsertDriver(uid, data[uid]));
        renderList();
      });
    }

    function removeDriver(uid) {
      delete drivers[uid];
      if (markers[uid]) {
        map.removeLayer(markers[uid]);
        delete markers[uid];
      }
    }

    function upsertDriver(uid, info) {
      drivers[uid] = info;

      if (info.lat != null && info.lng != null) {
        if (!markers[uid]) {
          markers[uid] = L.marker([info.lat, info.lng]).addTo(map);
          markers[uid].on("click", () => selectDriver(uid));
        } else {
          markers[uid].setLatLng([info.lat, info.lng]);
        }
        markers[uid].bindPopup(popupHtml(info));
      }
    }

    function popupHtml(info) {
      return "<strong>" + escapeHtml(info.nome || "Motorista") + "</strong><br>" +
        (info.placa ? escapeHtml(info.placa) + "<br>" : "") +
        "Status: " + statusLabel(info.status) + "<br>" +
        "Atualizado: " + formatTime(info.ultimaAtualizacao);
    }

    // ---------- lista lateral ----------
    function renderList() {
      const uids = Object.keys(drivers);
      summary.textContent = uids.length
        ? uids.length + " motorista(s) registrados"
        : "Nenhum motorista registrado ainda.";

      if (uids.length === 0) {
        driverList.innerHTML = '<div class="empty-state">Assim que um motorista aceitar o rastreamento, ele aparecerá aqui.</div>';
        return;
      }

      // mais recentes primeiro
      uids.sort((a, b) => (drivers[b].ultimaAtualizacao || 0) - (drivers[a].ultimaAtualizacao || 0));

      driverList.innerHTML = "";
      uids.forEach(uid => {
        const info = drivers[uid];
        const card = document.createElement("div");
        card.className = "driver-card" + (uid === selectedUid ? " selected" : "");
        card.innerHTML =
          '<div class="name-row"><span class="driver-dot ' + dotClass(info) + '"></span>' +
          escapeHtml(info.nome || "Motorista") + '</div>' +
          '<div class="driver-meta">' +
          (info.telefone ? '<span class="label">Tel:</span> ' + escapeHtml(info.telefone) + '<br>' : '') +
          (info.placa ? '<span class="label">Veículo:</span> ' + escapeHtml(info.placa) + '<br>' : '') +
          (info.destino ? '<span class="label">Rota:</span> ' + escapeHtml(info.destino) + '<br>' : '') +
          '<span class="label">Status:</span> <span class="badge">' + statusLabel(info.status) + '</span><br>' +
          '<span class="label">Autorizado em:</span> ' + formatTime(info.autorizadoEm) + '<br>' +
          '<span class="label">Última atualização:</span> ' + formatTime(info.ultimaAtualizacao) +
          '</div>';
        card.addEventListener("click", () => selectDriver(uid));
        driverList.appendChild(card);
      });
    }

    function selectDriver(uid) {
      selectedUid = uid;
      renderList();
      const info = drivers[uid];
      if (info && info.lat != null && info.lng != null) {
        map.setView([info.lat, info.lng], 16);
        if (markers[uid]) markers[uid].openPopup();
      }
    }

    // ---------- helpers ----------
    function dotClass(info) {
      if (info.status === "permissao_negada") return "denied";
      if (info.status === "encerrado") return "offline";
      const age = Date.now() - (info.ultimaAtualizacao || 0);
      if (age < 2 * 60 * 1000) return "online";
      if (age < 10 * 60 * 1000) return "stale";
      return "offline";
    }

    function statusLabel(status) {
      const map = {
        ativo: "Ativo",
        aguardando_gps: "Aguardando GPS",
        permissao_negada: "Permissão negada",
        indisponivel: "GPS indisponível",
        timeout: "Tempo esgotado",
        encerrado: "Encerrado"
      };
      return map[status] || status || "—";
    }

    function formatTime(ts) {
      if (!ts) return "—";
      return new Date(ts).toLocaleString("pt-BR");
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[ch]));
    }
  </script>
</body>
</html>
